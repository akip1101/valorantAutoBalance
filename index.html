<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チーム分けツール</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6fa;
      padding: 30px;
      color: #333;
    }
    h2, h3 {
      text-align: center;
      margin-bottom: 15px;
      color: #444;
    }
    .player, .rank-setting {
      margin-bottom: 10px;
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    input, select {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: 0.2s;
    }
    button:hover {
      background: #43a047;
    }
    .teams {
      margin-top: 25px;
      display: none;
      justify-content: center;
      gap: 30px;
    }
    .team {
      background: white;
      border-radius: 12px;
      padding: 15px 20px;
      width: 220px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      opacity: 0;
      transform: scale(0.9);
      animation: fadeIn 0.6s ease forwards;
    }
    .team h3 {
      text-align: center;
      margin-bottom: 10px;
      padding: 8px 0;
      border-radius: 8px;
      color: white;
    }
    #teamA h3 { background: #42a5f5; }
    #teamB h3 { background: #ef5350; }
    ul { list-style: none; padding-left: 0; margin: 0; }
    ul li {
      padding: 6px 8px;
      margin-bottom: 6px;
      background: #f9f9f9;
      border-radius: 6px;
      font-size: 14px;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    #rank-settings {
      margin: 10px 0;
      max-height: 250px;
      overflow-y: scroll;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }
    #rank-settings::-webkit-scrollbar { width: 6px; }
    #rank-settings::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    details summary {
      cursor: pointer;
      padding: 8px;
      background: #e0e0e0;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>10人のチーム分けツール</h2>

  <!-- 折りたたみ式 -->
  <details>
    <summary>ランクの数値設定（クリックで開閉）</summary>
    <div id="rank-settings"></div>
  </details>

  <h3>プレイヤー入力</h3>
  <div id="players"></div>
  <button onclick="makeTeams()">チーム分け</button>

  <div class="teams" id="result">
    <div class="team" id="teamA">
      <h3>チームA</h3>
      <ul></ul>
    </div>
    <div class="team" id="teamB">
      <h3>チームB</h3>
      <ul></ul>
    </div>
  </div>

<script>
// ランク定義
const ranks = { 
  "アイアン1": 1, "アイアン2": 2, "アイアン3": 3,
  "ブロンズ1": 4, "ブロンズ2": 5, "ブロンズ3": 6,
  "シルバー1": 7, "シルバー2": 8, "シルバー3": 9,
  "ゴールド1": 10, "ゴールド2": 11, "ゴールド3": 12,
  "プラチナ1": 13, "プラチナ2": 14, "プラチナ3": 15,
  "ダイヤモンド1": 16, "ダイヤモンド2": 17, "ダイヤモンド3": 18,
  "アセンダント1": 19, "アセンダント2": 20, "アセンダント3": 21,
  "イモータル1": 22, "イモータル2": 23, "イモータル3": 24
};

// ランク設定UI生成
const rankSettingsDiv = document.getElementById("rank-settings");
for (const [rank, value] of Object.entries(ranks)) {
  rankSettingsDiv.innerHTML += `
    <div class="rank-setting">
      <label>${rank}</label>
      <input type="number" id="rankVal-${rank}" value="${value}" style="width:60px;">
    </div>
  `;
}

// ランク選択肢生成
function createRankOptions() {
  return Object.keys(ranks).map(r => `<option value="${r}">${r}</option>`).join("");
}

// プレイヤー入力フォーム生成
const playersDiv = document.getElementById("players");
for (let i = 0; i < 10; i++) {
  playersDiv.innerHTML += `
    <div class="player">
      <span>プレイヤー${i+1}:</span>
      <input type="text" id="name${i}" placeholder="名前">
      <select id="rank${i}">${createRankOptions()}</select>
    </div>
  `;
}

// チーム分け処理
function makeTeams() {
  // 最新ランク数値を取得して更新
  for (const rank of Object.keys(ranks)) {
    const input = document.getElementById(`rankVal-${rank}`);
    ranks[rank] = parseInt(input.value, 10) || ranks[rank];
  }

  const players = [];
  for (let i = 0; i < 10; i++) {
    const name = document.getElementById("name"+i).value || `プレイヤー${i+1}`;
    const rank = document.getElementById("rank"+i).value;
    players.push({ name, rank, score: ranks[rank] });
  }

  const total = players.reduce((s,p)=>s+p.score,0);
  let bestDiff = Infinity;
  let bestTeamA = null;

  function dfs(i, countA, sumA, chosen) {
    if (i === players.length) {
      if (countA === 5) {
        const sumB = total - sumA;
        const diff = Math.abs(sumA - sumB);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestTeamA = [...chosen];
        }
      }
      return;
    }
    if (countA < 5) {
      chosen.push(players[i]);
      dfs(i+1, countA+1, sumA + players[i].score, chosen);
      chosen.pop();
    }
    if ((i - countA) < 5) {
      dfs(i+1, countA, sumA, chosen);
    }
  }

  dfs(0,0,0,[]);

  const teamA = bestTeamA;
  const teamB = players.filter(p => !teamA.includes(p));

  document.getElementById("teamA").querySelector("ul").innerHTML =
    teamA.map(p => `<li>${p.name}</li>`).join("");
  document.getElementById("teamB").querySelector("ul").innerHTML =
    teamB.map(p => `<li>${p.name}</li>`).join("");

  const result = document.getElementById("result");
  result.style.display = "flex";
  result.querySelectorAll(".team").forEach(team => {
    team.style.animation = "none";
    void team.offsetWidth;
    team.style.animation = "";
  });
}
</script>
</body>
</html>
